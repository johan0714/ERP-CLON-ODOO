services:
  # 1. Backend FastAPI en la nube
  - type: web
    name: erp-odoo-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python -m backend.app.seed"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend React en la nube
  - type: web
    name: erp-odoo-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: erp-odoo-backend
          property: host

databases:
  # 3. Base de Datos PostgreSQL gestionada en la nube
  - name: erp-postgres
    databaseName: erp_database
    user: erp_admin
